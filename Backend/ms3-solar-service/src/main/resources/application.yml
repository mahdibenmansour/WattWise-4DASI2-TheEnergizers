spring:
  application:
    name: ms3-solar-service
  # Settings come from the Config Server when it is running; the service still starts without it.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  # Session 4: no database container yet, so the datasource is switched off by default.
  # Run with the "db" profile once PostgreSQL solar_db is available.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

server:
  port: 8083

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: db
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solar_db}
    username: ${DB_USER:wattwise}
    password: ${DB_PASSWORD:wattwise}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
