spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm "wattwise" (keys are fetched only when a token is checked)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/wattwise}

server:
  port: 8080

wattwise:
  security:
    enabled: ${SECURITY_ENABLED:false}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
