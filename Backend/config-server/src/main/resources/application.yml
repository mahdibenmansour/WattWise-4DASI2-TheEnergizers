spring:
  application:
    name: config-server
  profiles:
    # "native" serves the files in src/main/resources/config-repo.
    # Later we can switch to a Git repository (spring.cloud.config.server.git.uri).
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo

server:
  port: 8888

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
