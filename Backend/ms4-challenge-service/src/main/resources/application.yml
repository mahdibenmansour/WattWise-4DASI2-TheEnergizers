spring:
  application:
    name: ms4-challenge-service
  # Settings come from the Config Server when it is running; the service still starts without it.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  # Session 4: no database container needed yet, so MongoDB is switched off by default.
  # Run with the "db" profile once MongoDB challenge_db is available.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

server:
  port: 8084

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: db
  autoconfigure:
    exclude: []
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/challenge_db}
